<div class="pagination-bar d-flex justify-content-between align-items-center flex-wrap gap-3 my-4">
  <select
    class="form-select form-select-sm w-auto"
    aria-label="Results per page"
    (change)="onPageSizeChange($event)"
  >
    @for (size of pageSizeOptions; track size) {
      <option [value]="size" [selected]="size === pageSize()">{{ size }} per page</option>
    }
  </select>

  @if (totalPages() > 1) {
    <nav aria-label="Tournament results pages">
      <ul class="pagination mb-0">
        <li class="page-item" [class.disabled]="currentPage() === 1">
          <button type="button" class="page-link" (click)="previous()">Previous</button>
        </li>
        @for (page of pages(); track page) {
          <li class="page-item" [class.active]="page === currentPage()">
            <button type="button" class="page-link" (click)="goToPage(page)">{{ page }}</button>
          </li>
        }
        <li class="page-item" [class.disabled]="currentPage() === totalPages()">
          <button type="button" class="page-link" (click)="next()">Next</button>
        </li>
      </ul>
    </nav>
  }
</div>
